# Alertmanager Configuration for FinSecAI
global:
  resolve_timeout: 5m
  
  # Slack configuration (set via environment variables)
  slack_api_url: '${SLACK_WEBHOOK_URL}'
  
  # PagerDuty configuration
  pagerduty_url: 'https://events.pagerduty.com/v2/enqueue'

# The root route with all parameters
route:
  # Default receiver
  receiver: 'default'
  
  # How long to wait to group alerts before sending notification
  group_wait: 10s
  
  # How long to wait to re-send alerts that have already been sent
  group_interval: 10s
  
  # How long an alert will stay in an inhibiting state
  repeat_interval: 12h
  
  # Routes for specific alerts
  routes:
    # Critical severity - immediate escalation
    - match:
        severity: critical
      receiver: 'critical'
      repeat_interval: 5m
      continue: true
    
    # Security alerts
    - match:
        component: security
      receiver: 'security'
      group_wait: 1s
      repeat_interval: 1h
      continue: true
    
    # Database alerts
    - match:
        component: database
      receiver: 'database'
      group_wait: 30s
      repeat_interval: 2h
      continue: true
    
    # Infrastructure alerts
    - match:
        component: infrastructure
      receiver: 'infrastructure'
      repeat_interval: 4h
    
    # Pipeline alerts
    - match:
        component: pipeline
      receiver: 'pipeline'
      group_wait: 30s
      repeat_interval: 1h

# Inhibition rules to suppress alerts
inhibit_rules:
  # Inhibit warning when critical alert is firing
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname', 'component']
  
  # Inhibit info when warning is firing
  - source_match:
      severity: 'warning'
    target_match:
      severity: 'info'
    equal: ['alertname', 'component']

# Receivers configuration
receivers:
  - name: 'default'
    slack_configs:
      - channel: '#alerts'
        title: 'Alert: {{ .GroupLabels.alertname }}'
        text: '{{ range .Alerts }}{{ .Annotations.description }}{{ end }}'
        send_resolved: true
        color: '{{ if eq .Status "firing" }}danger{{ else }}good{{ end }}'

  - name: 'critical'
    # PagerDuty for critical alerts
    pagerduty_configs:
      - service_key: '${PAGERDUTY_SERVICE_KEY}'
        description: '{{ .GroupLabels.alertname }}: {{ index .Alerts 0 .Annotations.summary }}'
        details:
          firing: '{{ template "pagerduty.default.instances" .Alerts.Firing }}'
          resolved: '{{ template "pagerduty.default.instances" .Alerts.Resolved }}'
    
    # Slack critical channel
    slack_configs:
      - channel: '#critical-alerts'
        title: '🚨 CRITICAL: {{ .GroupLabels.alertname }}'
        text: '{{ range .Alerts }}{{ .Annotations.description }}\nRunbook: {{ .Annotations.runbook }}{{ end }}'
        send_resolved: true
        color: 'danger'
        actions:
          - type: button
            text: 'View Dashboard'
            url: '{{ index .Alerts 0 .Annotations.dashboard }}'
          - type: button
            text: 'View Runbook'
            url: '{{ index .Alerts 0 .Annotations.runbook }}'

  - name: 'security'
    slack_configs:
      - channel: '#security-alerts'
        title: '🔒 SECURITY: {{ .GroupLabels.alertname }}'
        text: '{{ range .Alerts }}{{ .Annotations.summary }}\n{{ .Annotations.description }}{{ end }}'
        send_resolved: true
        color: 'danger'
    
    # Also send to email for compliance
    email_configs:
      - to: '{{ env "SECURITY_EMAIL" }}'
        headers:
          Subject: 'Security Alert: {{ .GroupLabels.alertname }}'

  - name: 'database'
    slack_configs:
      - channel: '#database-alerts'
        title: '🗄️ DATABASE: {{ .GroupLabels.alertname }}'
        text: '{{ range .Alerts }}{{ .Annotations.summary }}\n{{ .Annotations.description }}{{ end }}'
        send_resolved: true
        color: 'warning'

  - name: 'infrastructure'
    slack_configs:
      - channel: '#infrastructure-alerts'
        title: '⚙️ INFRASTRUCTURE: {{ .GroupLabels.alertname }}'
        text: '{{ range .Alerts }}{{ .Annotations.summary }}\n{{ .Annotations.description }}{{ end }}'
        send_resolved: true
        color: 'warning'

  - name: 'pipeline'
    slack_configs:
      - channel: '#pipeline-alerts'
        title: '⚡ PIPELINE: {{ .GroupLabels.alertname }}'
        text: '{{ range .Alerts }}{{ .Annotations.summary }}\n{{ .Annotations.description }}{{ end }}'
        send_resolved: true
        color: 'warning'
