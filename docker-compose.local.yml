version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: finsecai_postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-finsecai}
      POSTGRES_USER: ${DB_USER:-finsecai}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-finsecai_secure_password}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./api/database/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-finsecai}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - finsecai_network

  # FastAPI Backend
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: finsecai_api
    ports:
      - "${API_PORT:-8000}:8000"
    environment:
      DATABASE_URL: postgresql://${DB_USER:-finsecai}:${DB_PASSWORD:-finsecai_secure_password}@postgres:5432/${DB_NAME:-finsecai}
      DEBUG: ${DEBUG:-false}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      ENVIRONMENT: ${ENVIRONMENT:-development}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - .:/app
      - /app/__pycache__
    command: sh -c "python api/database/init_db.py && python -m uvicorn api.main:app --host 0.0.0.0 --port 8000 --reload"
    networks:
      - finsecai_network

  # Streamlit Frontend (Optional)
  streamlit:
    build:
      context: .
      dockerfile: Dockerfile.streamlit
    container_name: finsecai_streamlit
    ports:
      - "${STREAMLIT_PORT:-8501}:8501"
    environment:
      API_BASE_URL: http://api:8000
    depends_on:
      - api
    volumes:
      - .:/app
      - /app/__pycache__
    networks:
      - finsecai_network

networks:
  finsecai_network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
